<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050203">
  <meta name="description" content="KingPabloBypass - Fast, Simple, Secure URL resolver. By @KingPablo_77">
  <title>KingPabloBypass</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Opening screen -->
  <div id="welcome" class="welcome" role="status" aria-live="polite">
    <div class="welcome-inner">
      <p class="w-title">SELAMAT DATANG</p>
      <p class="w-sub">DI WEBSITE BYPASS</p>
      <p class="w-by">By @KingPablo_77</p>
    </div>
  </div>

  <div class="bg-glow" aria-hidden="true"></div>

  <!-- Notifikasi error -->
  <div id="toast" class="toast" role="alert" aria-live="assertive" hidden>
    <span class="toast-icon" aria-hidden="true">⚠️</span>
    <span id="toast-text"></span>
  </div>

  <main id="app" class="app" aria-hidden="true">
    <section class="card" aria-labelledby="brand">
      <header class="card-head">
        <h1 id="brand" class="brand">KingPabloBypass</h1>
        <p class="tagline">Fast • Simple • Secure</p>
      </header>

      <!-- 1. Input -->
      <form id="form-view" class="view" novalidate>
        <label for="url-input" class="field-label">URL</label>
        <input
          id="url-input"
          class="input"
          type="url"
          inputmode="url"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="Masukkan URL yang ingin diproses..."
          aria-label="URL yang ingin diproses">
        <button id="submit-btn" class="btn btn-primary" type="submit">BYPASS LINK</button>
      </form>

      <!-- 2. Processing -->
      <section id="process-view" class="view process" hidden aria-live="polite">
        <div id="spinner" class="spinner" role="progressbar" aria-label="Progres pemrosesan"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="spin-arc"></div>
          <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="ring-track" cx="60" cy="60" r="52"></circle>
            <circle id="ring-bar" class="ring-bar" cx="60" cy="60" r="52"></circle>
          </svg>
          <span id="pct" class="pct">0%</span>
          <svg class="check" viewBox="0 0 52 52" aria-hidden="true">
            <path d="M14 27l8 8 16-17"></path>
          </svg>
        </div>
        <p id="status" class="status">Initializing...</p>

        <!-- 3. Hasil (muncul setelah 100%) -->
        <div id="result" class="result" hidden>
          <h2 class="result-title">PROCESS COMPLETE</h2>
          <p class="result-sub">Link berhasil diproses.</p>
          <div class="dest">
            <p class="dest-label">Destination URL</p>
            <p id="dest-url" class="dest-url"></p>
          </div>
          <button id="open-btn" class="btn btn-primary" type="button">OPEN LINK</button>
          <button id="again-btn" class="btn btn-ghost" type="button">PROCESS ANOTHER LINK</button>
        </div>
      </section>
    </section>

    <footer class="footer">© 2026 KingPabloBypass • By @KingPablo_77</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
